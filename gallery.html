<style>
    .gallery-section { margin-bottom: 60px; padding: 0 10px; }
    .section-title { 
        font-size: 1.4rem; 
        color: var(--deep-brown); 
        border-bottom: 2px solid var(--sun-gold); 
        display: inline-block;
        margin-bottom: 25px;
        padding-bottom: 5px;
    }
    
    /* 4枚横並びのレイアウト */
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }
    
    .gallery-item { text-align: center; }
    
    .gallery-item img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: 0.3s;
    }
    
    .gallery-item img:hover { transform: translateY(-5px); }
    
    .caption {
        margin-top: 10px;
        font-size: 0.85rem;
        color: var(--deep-brown);
        font-weight: bold;
    }

    @media (max-width: 768px) {
        .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }
</style>

<div class="container">
    <div class="gallery-section">
        <h2 class="section-title">Course Selection</h2>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="gallery_photo/A_amyu-zu.jpg" alt="アミューズ">
                <div class="caption">アミューズ</div>
            </div>
            <div class="gallery-item">
                <img src="gallery_photo/A_supu.jpg" alt="スープ">
                <div class="caption">スープ</div>
            </div>
            <div class="gallery-item">
                <img src="gallery_photo/A_mein.jpg" alt="メイン料理">
                <div class="caption">メイン料理</div>
            </div>
            <div class="gallery-item">
                <img src="gallery_photo/A_deza-to.jpg" alt="デザート">
                <div class="caption">デザート</div>
            </div>
        </div>
    </div>
</div>
