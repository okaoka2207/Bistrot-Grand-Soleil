<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Bistro Grand Soleil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 他のページと共通のベースカラー */
        :root { 
            --sun-gold: #F8B500; 
            --deep-brown: #3C2A21; 
            --bg-cream: #FFFEF9; 
        }
        
        body { 
            font-family: "Times New Roman", serif; 
            background-color: var(--bg-cream); 
            color: var(--deep-brown);
            margin: 0; 
            line-height: 1.6;
        }

        /* 共通ナビゲーション */
        nav { 
            background: white; 
            height: 70px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: var(--deep-brown); font-weight: bold; font-size: 0.9rem; }
        .nav-links a:hover { color: var(--sun-gold); }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        
        h1 { text-align: center; font-size: 2rem; margin-bottom: 50px; letter-spacing: 2px; }
        
        /* 昼/夜の大きな見出し */
        .category-title {
            background-color: var(--deep-brown);
            color: white;
            padding: 10px 20px;
            margin: 40px 0 20px 0;
            font-size: 1.2rem;
            border-radius: 4px;
        }

        .course-label {
            font-size: 1.1rem;
            border-left: 4px solid var(--sun-gold);
            padding-left: 10px;
            margin: 20px 0;
        }

        /* ギャラリーグリッド */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }
        
        .gallery-item { text-align: center; }
        .gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .caption { font-size: 0.8rem; margin-top: 5px; }

        @media (max-width: 768px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="topics.html">Topics</a>
            <a href="gallery.html" style="color: var(--sun-gold);">Gallery</a>
            <a href="menu.html">Menu</a>
        </div>
    </nav>

    <div class="container">
        <h1>Gallery</h1>

        <h2 class="category-title"><i class="fas fa-sun"></i> LUNCH COURSES</h2>
        
        <div class="course-label">Lunch A</div>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="gallery_photo/A_amyu-zu.jpg"><div class="caption">アミューズ</div></div>
            <div class="gallery-item"><img src="gallery_photo/A_supu.jpg"><div class="caption">スープ</div></div>
            <div class="gallery-item"><img src="gallery_photo/A_mein.jpg"><div class="caption">メイン</div></div>
            <div class="gallery-item"><img src="gallery_photo/A_deza-to.jpg"><div class="caption">デザート</div></div>
        </div>

        <div class="course-label">Lunch B & C</div>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="gallery_photo/LB_1.jpg"><div class="caption">料理名</div></div>
            <div class="gallery-item"><img src="gallery_photo/LB_2.jpg"><div class="caption">料理名</div></div>
            <div class="gallery-item"><img src="gallery_photo/LC_1.jpg"><div class="caption">料理名</div></div>
            <div class="gallery-item"><img src="gallery_photo/LC_2.jpg"><div class="caption">料理名</div></div>
        </div>

        <h2 class="category-title"><i class="fas fa-moon"></i> DINNER COURSES</h2>
        
        <div class="course-label">Dinner A, B, C</div>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="gallery_photo/DA_1.jpg"><div class="caption">ディナーA</div></div>
            <div class="gallery-item"><img src="gallery_photo/DB_1.jpg"><div class="caption">ディナーB</div></div>
            <div class="gallery-item"><img src="gallery_photo/DC_1.jpg"><div class="caption">ディナーC</div></div>
            <div class="gallery-item"><img src="gallery_photo/DC_2.jpg"><div class="caption">ディナー料理</div></div>
        </div>
    </div>

</body>
</html>
